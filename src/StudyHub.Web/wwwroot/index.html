<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00897b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StudyHub" />
    <title>StudyHub</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot-splash">Loading&hellip;</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <div id="sw-update-banner" style="display:none">
        A new version is available.
        <button onclick="applyUpdate()">Reload to update</button>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/idb.js"></script>
    <script src="js/interop.js"></script>
    <script src="js/keys.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // The service worker is skipped on localhost: every rebuild would install a new one and reload the page in a loop.
        const _isLocalDev = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
        let _pendingWorker = null;

        function showUpdateBanner(worker) {
            _pendingWorker = worker;
            document.getElementById('sw-update-banner').style.display = 'block';
        }

        function applyUpdate() {
            if (_pendingWorker) _pendingWorker.postMessage({ type: 'SKIP_WAITING' });
        }

        if ('serviceWorker' in navigator && !_isLocalDev) {
            navigator.serviceWorker.register('service-worker.js');
            navigator.serviceWorker.ready.then(reg => {
                if (reg.waiting) showUpdateBanner(reg.waiting);
                reg.addEventListener('updatefound', () => {
                    const sw = reg.installing;
                    sw.addEventListener('statechange', () => {
                        if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(sw);
                    });
                });
            });
            let _refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (_refreshing) return;
                _refreshing = true;
                location.reload();
            });
        } else if (_isLocalDev && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        }
    </script>
</body>

</html>
