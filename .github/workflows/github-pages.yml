name: Deploy Web to GitHub Pages

# Deploys src/StudyHub.Web (Blazor WASM) to https://stepkie.github.io/StudyHub/ on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x

      # GHPages=true activates PublishSPAforGitHubPages.Build: rewrites <base href> to /StudyHub/ and emits a 404.html so deep links work.
      - name: Publish Blazor WASM
        run: dotnet publish src/StudyHub.Web/StudyHub.Web.csproj -c Release -p:GHPages=true -o dist/Web --nologo

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist/Web/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
